<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90e2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9013fe;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font: bold 40px sans-serif; fill: white; }
      .subtitle { font: 20px sans-serif; fill: #e0e0e0; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <text x="50%" y="40%" text-anchor="middle" class="title">Awesome Curriculum Management</text>
  <text x="50%" y="65%" text-anchor="middle" class="subtitle">Top Tools &amp; Ecosystem</text>
  <circle cx="10%" cy="50%" r="20" fill="white" opacity="0.2">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="90%" cy="50%" r="20" fill="white" opacity="0.2">
    <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>